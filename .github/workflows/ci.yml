name: ci

# Build and test a CLEAN CLONE of the package: the guarantee a public SPM owes its consumers (ForgeCore
# resolves this package by URL at a tag). Same shape as ForgeCore's and mlx-engine-swift's CI.
#
# BUILD SYSTEM (must stay pinned): the package links MLX, and MLX loads its Metal kernels from a
# `default.metallib` compiled from Cmlx's `.metal` sources into a resource bundle beside the test binary.
# Only the `swiftbuild` build system compiles those sources; the deprecated `native` one ships no metallib,
# so the first allocator call aborts the whole xctest process (signal 5) while the log can still read
# "all tests passed" — the trap that once had mlx-engine-swift's CI green while broken. Do not remove it.
#
# WHAT RUNS HERE, on the CPU stream and entirely from the repository: the module-tree and key-inventory
# checks, the block schedule, forward shapes with window padding, and the probes that guard HEART's
# shape-safe porting traps — reflect/replicate padding vs torch, pixel-shuffle order, the RIB coordinate
# table, the QKV split order, head padding 64 == 40, the shifted-window pad-and-crop, and the fp16
# channel-attention pool overflow — plus the offline conformance suites (C0–C14 surface, MAT-1..5 per
# variant and lane, CAN-1..3, inference mode). The S0 key contract on real weights self-skips unless
# HEART_WEIGHTS points at converted files; the weights live at mlx-community/HEART-{fp16,fp32} and are
# not fetched here. The GPU lanes (S2b, perf, tiling, footprints) run locally through `heart-smoke` —
# see PORTING-SPEC.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          # Informational: the metallib compile needs this component. The suites run on the CPU stream.
          xcodebuild -showComponent MetalToolchain || echo "MetalToolchain component not reported"
      - name: Build (all products)
        run: swift build --build-system swiftbuild
      - name: Test
        run: swift test --build-system swiftbuild
